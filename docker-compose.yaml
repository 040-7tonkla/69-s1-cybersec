version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: 69-s1-db
    ports:
      - "54327:5432"
    environment:
      POSTGRES_PASSWORD: tonkla2548
      POSTGRES_USER: sanchai
      POSTGRES_DB: sanchai
    volumes:
      - ./data:/var/lib/postgresql/data

  admin:
    image: dpage/pgadmin4
    container_name: 69-s1-admin
    environment:
      PGADMIN_DEFAULT_EMAIL: sanchai-t@rmutp.ac.th
      PGADMIN_DEFAULT_PASSWORD: tonkla2548
    ports:
      - "8081:80"
    depends_on:
      - db
